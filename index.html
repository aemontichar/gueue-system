<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคิว สำนักงานสวัสดิการและคุ้มครองแรงงานจังหวัดนครสวรรค์</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .print-only { display: none; }
        @media print {
            body * { visibility: hidden; }
            .print-only, .print-only * { visibility: visible; }
            .print-only { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 3 ปุ่มบริการหลัก
        const services = [
            { id: '1', code: 'A', name: 'เรื่องร้องเรียน / ร้องทุกข์', color: 'bg-red-500' },
            { id: '2', code: 'B', name: 'ปรึกษาปัญหาแรงงาน', color: 'bg-blue-600' },
            { id: '3', code: 'C', name: 'อื่นๆ', color: 'bg-orange-500' }
        ];

        function App() {
            const [view, setView] = useState('kiosk');
            const [queues, setQueues] = useState(() => {
                const saved = localStorage.getItem('swo_queues');
                return saved ? JSON.parse(saved) : [];
            });
            const [printQueue, setPrintQueue] = useState(null);
            const [soundEnabled, setSoundEnabled] = useState(false);
            const audioCtxRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('swo_queues', JSON.stringify(queues));
            }, [queues]);

            const enableSound = () => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
                setSoundEnabled(true);
                alert("เปิดระบบเสียงเรียบร้อยแล้ว");
            };

            const playDingDong = () => {
                if (!audioCtxRef.current) return Promise.resolve();
                return new Promise(resolve => {
                    const ctx = audioCtxRef.current;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gainNode = ctx.createGain();

                    osc1.type = 'sine';
                    osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(659.25, ctx.currentTime); 
                    osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.5); 

                    gainNode.gain.setValueAtTime(0, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);

                    osc1.connect(gainNode);
                    osc2.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    osc1.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 0.5);
                    osc2.start(ctx.currentTime + 0.5);
                    osc2.stop(ctx.currentTime + 1.5);

                    setTimeout(resolve, 1500);
                });
            };

            const speak = (text) => {
                if (!('speechSynthesis' in window)) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            };

            const callQueueVoice = async (qNumber, counter) => {
                if (soundEnabled) {
                    await playDingDong();
                    let pronounceQ = qNumber.split('').join(' ');
                    speak(`ขอเชิญหมายเลข, ${pronounceQ}, ที่ช่องบริการหมายเลข, ${counter} ค่ะ`);
                }
            };

            const generateQueueNumber = (serviceCode) => {
                const today = new Date().toLocaleDateString('th-TH');
                const todayQueues = queues.filter(q => q.date === today && q.serviceCode === serviceCode);
                const count = todayQueues.length + 1;
                return `${serviceCode}${String(count).padStart(3, '0')}`;
            };

            const issueQueue = (serviceIndex) => {
                const service = services[serviceIndex];
                if(!service) return;
                
                const now = new Date();
                const qNumber = generateQueueNumber(service.code);
                const newQueue = {
                    id: Date.now(),
                    number: qNumber,
                    serviceCode: service.code,
                    serviceName: service.name,
                    status: 'waiting', 
                    counter: null,
                    date: now.toLocaleDateString('th-TH'),
                    issueTimestamp: now.getTime(),
                    callTimestamp: null,
                    completeTimestamp: null,
                    time: now.toLocaleTimeString('th-TH')
                };
                
                const updated = [...queues, newQueue];
                setQueues(updated);
                setPrintQueue(newQueue);
                
                setTimeout(() => {
                    window.print();
                }, 500);
            };

            // กดปุ่ม 1, 2, 3 บนคีย์บอร์ด
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (view === 'kiosk') {
                        const key = e.key;
                        if (['1', '2', '3'].includes(key)) {
                            const index = parseInt(key) - 1;
                            issueQueue(index);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [view, queues]);

            const callNextQueue = (counterNumber) => {
                const waitingQueues = queues.filter(q => q.status === 'waiting');
                if (waitingQueues.length === 0) {
                    alert('ไม่มีคิวรอรับบริการ');
                    return;
                }
                
                const nextQueue = waitingQueues[0];
                const now = Date.now();
                const updatedQueues = queues.map(q => {
                    if (q.id === nextQueue.id) {
                        return { 
                            ...q, 
                            status: 'calling', 
                            counter: counterNumber,
                            callTimestamp: now 
                        };
                    }
                    return q;
                });
                setQueues(updatedQueues);
                callQueueVoice(nextQueue.number, counterNumber);
            };

            const completeQueue = (id) => {
                const now = Date.now();
                setQueues(queues.map(q => q.id === id ? { 
                    ...q, 
                    status: 'completed', 
                    completeTimestamp: now 
                } : q));
            };

            const resetAllQueues = () => {
                if (confirm('คุณต้องการรีเซ็ตเริ่มรันเลขคิวใหม่ใช่หรือไม่?')) {
                    const today = new Date().toLocaleDateString('th-TH');
                    const oldHistory = queues.filter(q => q.date !== today || q.status === 'completed');
                    setQueues(oldHistory);
                    alert('รีเซ็ตลำดับคิวเรียบร้อยแล้ว!');
                }
            };

            const getTodayStats = () => {
                const today = new Date().toLocaleDateString('th-TH');
                const todayData = queues.filter(q => q.date === today);
                const completedData = todayData.filter(q => q.status === 'completed' && q.callTimestamp && q.completeTimestamp);

                let avgServiceTimeMin = 0;
                if (completedData.length > 0) {
                    const totalDuration = completedData.reduce((acc, q) => acc + (q.completeTimestamp - q.callTimestamp), 0);
                    avgServiceTimeMin = (totalDuration / completedData.length / 1000 / 60).toFixed(1);
                }

                return {
                    total: todayData.length,
                    waiting: todayData.filter(q => q.status === 'waiting').length,
                    completed: completedData.length,
                    avgServiceTimeMin
                };
            };

            const exportCSV = () => {
                let csv = "ID,QueueNumber,Service,Status,Counter,Date,IssueTime,CallTime,CompleteTime,DurationMin\n";
                queues.forEach(q => {
                    const issueT = q.issueTimestamp ? new Date(q.issueTimestamp).toLocaleTimeString('th-TH') : '';
                    const callT = q.callTimestamp ? new Date(q.callTimestamp).toLocaleTimeString('th-TH') : '';
                    const compT = q.completeTimestamp ? new Date(q.completeTimestamp).toLocaleTimeString('th-TH') : '';
                    const duration = (q.callTimestamp && q.completeTimestamp) ? ((q.completeTimestamp - q.callTimestamp)/1000/60).toFixed(1) : '0';
                    csv += `"${q.id}","${q.number}","${q.serviceName}","${q.status}","${q.counter || ''}","${q.date}","${issueT}","${callT}","${compT}","${duration}"\n`;
                });
                
                const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `queue_report_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const stats = getTodayStats();

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-white shadow-md p-4 no-print flex justify-between items-center px-8">
                        <div className="font-bold text-orange-600 text-lg">สำนักงานสวัสดิการและคุ้มครองแรงงานจังหวัดนครสวรรค์</div>
                        <div className="flex gap-3">
                            <button onClick={() => setView('kiosk')} className={`px-4 py-2 rounded font-bold ${view==='kiosk' ? 'bg-orange-500 text-white' : 'bg-gray-200'}`}>ตู้กดคิว (Kiosk)</button>
                            <button onClick={() => setView('staff')} className={`px-4 py-2 rounded font-bold ${view==='staff' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>จุดบริการ 1-10</button>
                            <button onClick={() => setView('display')} className={`px-4 py-2 rounded font-bold ${view==='display' ? 'bg-gray-900 text-white' : 'bg-gray-200'}`}>จอ TV รวม</button>
                            <button onClick={() => setView('stats')} className={`px-4 py-2 rounded font-bold ${view==='stats' ? 'bg-purple-600 text-white' : 'bg-gray-200'}`}>📊 สถิติข้อมูล</button>
                        </div>
                    </nav>

                    <div className="flex-1 no-print">
                        {view === 'kiosk' && (
                            <div className="p-8 max-w-5xl mx-auto text-center">
                                <h1 className="text-4xl font-bold text-orange-600 mb-2">กดรับบัตรคิว</h1>
                                <p className="text-xl mb-8">กดเลือกบริการบนหน้าจอ หรือ <b>กดตัวเลข 1, 2, 3 บนคีย์บอร์ด</b></p>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {services.map((s, index) => (
                                        <button 
                                            key={s.id}
                                            onClick={() => issueQueue(index)}
                                            className={`${s.color} text-white p-8 rounded-xl shadow-lg hover:opacity-90 transform hover:scale-105 transition-all text-center relative overflow-hidden flex flex-col justify-between min-h-[220px]`}
                                        >
                                            <div className="bg-white/20 px-3 py-1 rounded-lg font-bold text-lg self-end">
                                                กดเลข {index + 1}
                                            </div>
                                            <div>
                                                <h2 className="text-4xl font-bold mb-2">งาน {s.code}</h2>
                                                <p className="text-2xl font-medium">{s.name}</p>
                                            </div>
                                            <div className="text-xs text-white/80 mt-4">คลิกเพื่อพิมพ์บัตรคิว</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'staff' && (
                            <div className="p-6 max-w-6xl mx-auto">
                                <h1 className="text-3xl font-bold text-blue-800 mb-6">จุดบริการเจ้าหน้าที่ (Counters 1-10)</h1>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    {[...Array(10)].map((_, i) => {
                                        const counterNum = i + 1;
                                        const currentQ = queues.find(q => q.counter === counterNum && q.status === 'calling');
                                        return (
                                            <div key={i} className="bg-white p-4 rounded-xl shadow border-t-4 border-blue-500">
                                                <h3 className="font-bold text-lg mb-2">ช่องบริการ {counterNum}</h3>
                                                <div className="bg-gray-100 p-4 rounded text-center mb-4 min-h-[90px] flex flex-col justify-center">
                                                    {currentQ ? (
                                                        <>
                                                            <div className="text-3xl font-bold text-orange-600">{currentQ.number}</div>
                                                            <div className="text-xs text-gray-600 truncate">{currentQ.serviceName}</div>
                                                        </>
                                                    ) : (
                                                        <div className="text-gray-400">ว่าง</div>
                                                    )}
                                                </div>
                                                <div className="flex flex-col gap-2">
                                                    <button onClick={() => callNextQueue(counterNum)} className="bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-bold">เรียกคิวถัดไป</button>
                                                    {currentQ && (
                                                        <button onClick={() => completeQueue(currentQ.id)} className="bg-green-600 text-white py-1 rounded font-bold">ปิดงานบริการ</button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'display' && (
                            <div className="p-6 h-screen flex flex-col bg-gray-900 text-white">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                                    <h1 className="text-3xl font-bold text-orange-500">สำนักงานสวัสดิการและคุ้มครองแรงงานจังหวัดนครสวรรค์</h1>
                                    <button onClick={enableSound} className="bg-orange-500 text-white px-4 py-2 rounded font-bold">
                                        {soundEnabled ? '🔊 เสียงเปิดอยู่' : '🔈 คลิกเปิดระบบเสียง'}
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-8 flex-1">
                                    <div className="bg-gray-800 rounded-xl p-6 border-2 border-orange-500 text-center flex flex-col justify-center">
                                        <h2 className="text-3xl text-gray-300 mb-4">คิวที่กำลังเรียก</h2>
                                        {queues.filter(q => q.status === 'calling').length > 0 ? (
                                            <div>
                                                <div className="text-9xl font-bold text-orange-500 animate-pulse">{queues.filter(q => q.status === 'calling').slice(-1)[0].number}</div>
                                                <div className="text-5xl text-yellow-400 mt-4">ช่องบริการ {queues.filter(q => q.status === 'calling').slice(-1)[0].counter}</div>
                                            </div>
                                        ) : <div className="text-gray-500 text-4xl">รอเรียกคิว...</div>}
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        {[...Array(10)].map((_, i) => {
                                            const cNum = i + 1;
                                            const qObj = queues.slice().reverse().find(q => q.counter === cNum && q.status === 'calling');
                                            return (
                                                <div key={i} className="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
                                                    <span className="text-gray-400">ช่อง {cNum}</span>
                                                    <span className="text-3xl font-bold text-green-400">{qObj ? qObj.number : '---'}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'stats' && (
                            <div className="p-8 max-w-5xl mx-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h1 className="text-3xl font-bold text-gray-800">สรุปข้อมูลและสถิติการให้บริการประจำวัน</h1>
                                    <div className="flex gap-3">
                                        <button onClick={exportCSV} className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold">📥 ดาวน์โหลด Excel/CSV</button>
                                        <button onClick={resetAllQueues} className="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 font-bold">🔄 เริ่มรันเลขคิวใหม่</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                                    <div className="bg-white p-6 rounded-xl shadow border-l-4 border-blue-500">
                                        <div className="text-gray-500 text-sm">ผู้รับบริการวันนี้ทั้งหมด</div>
                                        <div className="text-4xl font-bold text-blue-600">{stats.total} คน</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow border-l-4 border-yellow-500">
                                        <div className="text-gray-500 text-sm">กำลังรอรับบริการ</div>
                                        <div className="text-4xl font-bold text-yellow-600">{stats.waiting} คน</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                                        <div className="text-gray-500 text-sm">รับบริการเสร็จสิ้นแล้ว</div>
                                        <div className="text-4xl font-bold text-green-600">{stats.completed} คน</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow border-l-4 border-purple-500">
                                        <div className="text-gray-500 text-sm">เวลาบริการเฉลี่ย / คน</div>
                                        <div className="text-4xl font-bold text-purple-600">{stats.avgServiceTimeMin} นาที</div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow overflow-hidden">
                                    <h2 className="p-4 bg-gray-50 border-b font-bold text-lg">ประวัติรายการคิวทั้งหมด ({queues.length} รายการ)</h2>
                                    <div className="max-h-96 overflow-y-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-gray-100 text-gray-600 text-sm border-b">
                                                    <th className="p-3">เลขคิว</th>
                                                    <th className="p-3">ประเภทงาน</th>
                                                    <th className="p-3">สถานะ</th>
                                                    <th className="p-3">ช่องบริการ</th>
                                                    <th className="p-3">เวลาที่กด</th>
                                                    <th className="p-3">เวลาที่ให้บริการต่อคน</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {queues.slice().reverse().map(q => {
                                                    const duration = (q.callTimestamp && q.completeTimestamp) 
                                                        ? ((q.completeTimestamp - q.callTimestamp)/1000/60).toFixed(1) + ' นาที' 
                                                        : '-';
                                                    return (
                                                        <tr key={q.id} className="border-b hover:bg-gray-50 text-sm">
                                                            <td className="p-3 font-bold text-orange-600">{q.number}</td>
                                                            <td className="p-3">{q.serviceName}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-1 rounded text-xs font-bold ${q.status==='completed'?'bg-green-100 text-green-800':q.status==='calling'?'bg-yellow-100 text-yellow-800':'bg-gray-100 text-gray-800'}`}>
                                                                    {q.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-3">{q.counter ? `ช่อง ${q.counter}` : '-'}</td>
                                                            <td className="p-3">{q.time}</td>
                                                            <td className="p-3 font-semibold text-purple-700">{duration}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {printQueue && (
                        <div className="print-only p-4">
                            <h2 className="text-sm font-bold">สำนักงานสวัสดิการและคุ้มครองแรงงาน<br/>จังหวัดนครสวรรค์</h2>
                            <p className="text-xs border-b border-black pb-2 mb-2">ยินดีต้อนรับ</p>
                            <p className="text-sm">{printQueue.serviceName}</p>
                            <h1 className="text-6xl font-bold my-4">{printQueue.number}</h1>
                            <p className="text-xs">เวลา: {printQueue.time}</p>
                            <p className="text-xs border-t border-black pt-2 mt-4">กรุณารอเรียกหมายเลขของท่าน</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
